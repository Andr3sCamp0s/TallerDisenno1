[pytest]
testpaths = pruebas mis_pruebas
python_files = test_*.py
addopts = --tb=short
markers =
    etapa0: del caso a los drivers
    etapa1: contexto
    etapa2: contenedores
    etapa3: componentes y puertos
    etapa4: estilo arquitectonico
    etapa5: integracion y fallas
    etapa6: registro de decisiones
